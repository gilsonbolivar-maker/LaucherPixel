<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4a0e78" />
      <stop offset="100%" stop-color="#160324" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F5B942" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="#F5B942" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background rounded squircle / icon canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#8022B8" stroke-width="12" opacity="0.8" />

  <!-- Outer Hexagon Emblem -->
  <g transform="translate(256, 220) scale(7.5)" filter="url(#glow)">
    <polygon
      points="0,-20 17.3,-10 17.3,10 0,20 -17.3,10 -17.3,-10"
      stroke="url(#goldGrad)"
      stroke-width="3"
      stroke-linejoin="round"
      fill="rgba(245, 185, 66, 0.08)"
    />
    <line x1="0" y1="0" x2="0" y2="-19" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="16.5" y2="-9.5" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="16.5" y2="9.5" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="0" y2="19" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-16.5" y2="9.5" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <line x1="0" y1="0" x2="-16.5" y2="-9.5" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="4.5" fill="#F5B942" />
  </g>

  <!-- Brand Text -->
  <text x="256" y="420" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="900" font-size="34" letter-spacing="8" fill="#FFFFFF">PIXEL NEXO</text>
  <text x="256" y="452" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-weight="600" font-size="16" letter-spacing="4" fill="#F5B942">DEV LAUNCHER</text>
</svg>
